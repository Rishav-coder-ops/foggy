name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Test & Build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Code Style & Lint
        run: pnpm run lint
        env:
          CI: true

      - name: Run Shuffled Test Suite with Coverage (UTC)
        run: pnpm exec vitest run --coverage --sequence.shuffle
        env:
          CI: true
          TZ: UTC

      - name: Run Shuffled Test Suite (Asia/Kolkata)
        run: pnpm exec vitest run --sequence.shuffle
        env:
          CI: true
          TZ: Asia/Kolkata

      - name: Build Production Bundle
        run: pnpm run build
        env:
          CI: true

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
