# netlify.toml
# Production Netlify Configuration for Foggy Air Quality Assistant

[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Netlify Functions Settings
[functions]
  node_bundler = "esbuild"

# Proxy /api/aqi to netlify/functions/aqi
[[redirects]]
  from = "/api/aqi"
  to = "/.netlify/functions/aqi"
  status = 200

# Proxy /api/chat to netlify/functions/chat
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Proxy any other /api/* to matching Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA Fallback Redirect:
# Redirect all other client-side routes (e.g., /dashboard, /family, /memory, /chat)
# to /index.html with status 200 so hard browser refreshes never 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
